# Temporary (removed before merge): fetches the newer Public.Resource.Org editions,
# extracts their text for checking page links, and commits the PDFs small enough for GitHub.
name: Extract newer editions (temporary)
on:
  push:
    branches: [claude/project-thread-o9y5ld]
    paths: [.github/workflows/extract-editions.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
            - name: Fetch per-page OCR text
        run: |
          set -euo pipefail
          rm -f extract/*.txt.gz
          for id in b31.01.2016 b31.03.2020 b31.04.2016 b31.05.2016 b31.08.2016 b31.09.2014 b31g.2012; do
            item=pub.cfr.asme.$id
            curl -sSfL --retry 4 -o extract/$id.searchtext.txt.gz "https://archive.org/download/$item/asme.${id}_hocr_searchtext.txt.gz"
            curl -sSfL --retry 4 -o extract/$id.pageindex.json.gz "https://archive.org/download/$item/asme.${id}_hocr_pageindex.json.gz"
          done
          ls -l extract
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A extract
          git commit -m "Add per-page OCR text of the newer editions (temporary)"
          git push
